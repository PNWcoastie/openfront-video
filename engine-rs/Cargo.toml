[package]
name = "engine-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust port of the OpenFront.io simulation, verified tick by tick against the TypeScript engine"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
# openfront-video only: fetching, drawing, encoding, embedded assets.
ureq = "3"
flate2 = "1"
zstd = "0.13"
tiny-skia = "0.11"
ttf-parser = "0.25"
rustybuzz = "0.20"
openh264 = "0.9"
mp4 = "0.14"
openh264-sys2 = "0.9"

[build-dependencies]
flate2 = "1"
serde_json = "1"
zstd = "0.13"

[[bin]]
name = "openfront-video"
path = "src/bin/openfront-video/main.rs"

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
