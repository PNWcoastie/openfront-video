[package]
name = "openfront-web"
version = "0.1.0"
edition = "2021"
description = "openfront.video: renders OpenFront games with openfront-video and serves them with Discord embeds"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
